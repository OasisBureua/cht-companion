name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only: skip ECS/Lambda roll'
        type: boolean
        default: false
      deploy_all:
        description: 'Deploy all lanes (ignore change detection)'
        type: boolean
        default: false

concurrency:
  group: deploy-cht-companion-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  ECR_BACKEND_REPO: cht-companion
  ECR_WORKER_REPO: cht-companion-kb
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

jobs:
  gate:
    name: Check deploy trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Evaluate trigger
        id: check
        run: echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    outputs:
      deploy_backend: ${{ steps.scope.outputs.deploy_backend }}
      deploy_kb: ${{ steps.scope.outputs.deploy_kb }}
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve change base
        if: github.event.inputs.deploy_all != 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-resolve-deploy-base.sh
          ./scripts/ci-resolve-deploy-base.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before || '' }}" \
            "deploy-prod.yml" \
            "${{ github.ref_name }}" \
            "origin/main"

      - name: Detect changed paths
        if: github.event.inputs.deploy_all != 'true' && steps.base.outputs.base_resolved == 'true'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.sha }}
          base: ${{ steps.base.outputs.base_sha }}
          filters: |
            backend:
              - 'backend/**'
            kb:
              - 'kb/**'
            infra:
              - 'infrastructure/**'

      - name: Set deploy scope
        id: scope
        run: |
          chmod +x scripts/ci-detect-deploy-scope.sh
          FORCE_ALL=false
          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            FORCE_ALL=true
          elif [ "${{ steps.base.outputs.base_resolved || 'false' }}" != "true" ]; then
            FORCE_ALL=true
          fi
          ./scripts/ci-detect-deploy-scope.sh \
            "$FORCE_ALL" \
            "${{ steps.filter.outputs.backend || 'false' }}" \
            "${{ steps.filter.outputs.kb || 'false' }}" \
            "${{ steps.filter.outputs.infra || 'false' }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [gate, changes]
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            kb/requirements.txt
      - name: Backend tests
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: pip install -r requirements.txt && pytest
      - name: Worker tests
        if: needs.changes.outputs.deploy_kb == 'true'
        working-directory: ./kb
        run: pip install -r requirements.txt && pytest

  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [gate, changes, test]
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true'
    environment: prod
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Generate image tag
        id: meta
        run: |
          chmod +x scripts/next-prod-image-tag.sh
          IMAGE_TAG="$(./scripts/next-prod-image-tag.sh ${{ env.ECR_BACKEND_REPO }} "$AWS_REGION")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push backend image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push kb image
        if: needs.changes.outputs.deploy_kb == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./kb
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
