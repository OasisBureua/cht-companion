name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only: build images and show the Terraform plan, apply nothing'
        type: boolean
        default: false
      deploy_all:
        description: 'Deploy all lanes (ignore change detection)'
        type: boolean
        default: false

concurrency:
  group: deploy-cht-companion-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  ECR_BACKEND_REPO: cht-companion
  ECR_WORKER_REPO: cht-companion-kb
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERRAFORM_VERSION: 1.10.5
  TF_ENV_DIR: infrastructure/terraform/environments/us-east-1
  TF_BACKEND_CONFIG: ../backends/us-east-1-prod.hcl
  TF_VARS_FILE: ../variables/prod.github.tfvars
  TF_DR_ENV_DIR: infrastructure/terraform/environments/us-east-2
  TF_DR_BACKEND_CONFIG: ../backends/us-east-2-prod.hcl
  ECS_CLUSTER: cht-platform-cluster
  ECS_SERVICE: cht-companion

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

jobs:
  gate:
    name: Check deploy trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Evaluate trigger
        id: check
        run: echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    outputs:
      deploy_backend: ${{ steps.scope.outputs.deploy_backend }}
      deploy_kb: ${{ steps.scope.outputs.deploy_kb }}
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve change base
        if: github.event.inputs.deploy_all != 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-resolve-deploy-base.sh
          ./scripts/ci-resolve-deploy-base.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before || '' }}" \
            "deploy-prod.yml" \
            "${{ github.ref_name }}" \
            "origin/main"

      - name: Detect changed paths
        if: github.event.inputs.deploy_all != 'true' && steps.base.outputs.base_resolved == 'true'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.sha }}
          base: ${{ steps.base.outputs.base_sha }}
          filters: |
            backend:
              - 'backend/**'
            kb:
              - 'kb/**'
            infra:
              - 'infrastructure/**'

      - name: Set deploy scope
        id: scope
        run: |
          chmod +x scripts/ci-detect-deploy-scope.sh
          FORCE_ALL=false
          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            FORCE_ALL=true
          elif [ "${{ steps.base.outputs.base_resolved || 'false' }}" != "true" ]; then
            FORCE_ALL=true
          fi
          ./scripts/ci-detect-deploy-scope.sh \
            "$FORCE_ALL" \
            "${{ steps.filter.outputs.backend || 'false' }}" \
            "${{ steps.filter.outputs.kb || 'false' }}" \
            "${{ steps.filter.outputs.infra || 'false' }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [gate, changes]
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            kb/requirements.txt
      - name: Backend tests
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: pip install -r requirements.txt && pytest
      - name: Worker tests
        if: needs.changes.outputs.deploy_kb == 'true'
        working-directory: ./kb
        run: pip install -r requirements.txt && pytest

  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [gate, changes, test]
    # test is skipped for infra-only changes; still deploy then.
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.deploy_backend == 'true' ||
       needs.changes.outputs.deploy_kb == 'true' ||
       needs.changes.outputs.deploy_infra == 'true')
    environment: prod
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Generate image tag
        id: meta
        run: |
          chmod +x scripts/next-prod-image-tag.sh
          IMAGE_TAG="$(./scripts/next-prod-image-tag.sh ${{ env.ECR_BACKEND_REPO }} "$AWS_REGION")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push backend image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push kb embed image
        if: needs.changes.outputs.deploy_kb == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./kb
          file: ./kb/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:prod-latest
          cache-from: type=gha,scope=kb-embed
          cache-to: type=gha,mode=max,scope=kb-embed
      - name: Build and push kb enqueue image
        if: needs.changes.outputs.deploy_kb == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./kb
          file: ./kb/Dockerfile.enqueue
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}-enqueue
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:prod-latest-enqueue
          cache-from: type=gha,scope=kb-enqueue
          cache-to: type=gha,mode=max,scope=kb-enqueue
      # Terraform owns the ECS task definition and both Lambdas' image_uri, so it
      # does the rollout. Images built in this run get the new tag; images not
      # rebuilt keep whatever prod runs now (prod-latest before the first deploy).
      - name: Resolve image URIs
        id: images
        env:
          TAG: ${{ steps.meta.outputs.image_tag }}
          BUILT_BACKEND: ${{ needs.changes.outputs.deploy_backend }}
          BUILT_KB: ${{ needs.changes.outputs.deploy_kb }}
        run: |
          backend_repo="$ECR_REGISTRY/$ECR_BACKEND_REPO"
          kb_repo="$ECR_REGISTRY/$ECR_WORKER_REPO"

          current_lambda_image() {
            aws lambda get-function --function-name "$1" --region "$AWS_REGION" \
              --query 'Code.ImageUri' --output text 2>/dev/null || true
          }

          if [ "$BUILT_BACKEND" = "true" ]; then
            companion="$backend_repo:$TAG"
          else
            td="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" \
              --query 'services[?status==`ACTIVE`].taskDefinition | [0]' --output text 2>/dev/null || true)"
            companion=""
            if [ -n "$td" ] && [ "$td" != "None" ]; then
              companion="$(aws ecs describe-task-definition --task-definition "$td" --region "$AWS_REGION" \
                --query 'taskDefinition.containerDefinitions[0].image' --output text)"
            fi
            companion="${companion:-$backend_repo:prod-latest}"
          fi

          if [ "$BUILT_KB" = "true" ]; then
            kb="$kb_repo:$TAG"
            enqueue="$kb_repo:$TAG-enqueue"
          else
            kb="$(current_lambda_image cht-companion-kb)"
            enqueue="$(current_lambda_image cht-companion-kb-enqueue)"
            kb="${kb:-$kb_repo:prod-latest}"
            enqueue="${enqueue:-$kb_repo:prod-latest-enqueue}"
          fi

          {
            echo "companion=$companion"
            echo "kb=$kb"
            echo "enqueue=$enqueue"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Prod images"
            echo "| Component | Image |"
            echo "| --- | --- |"
            echo "| companion | \`$companion\` |"
            echo "| kb embed | \`$kb\` |"
            echo "| kb enqueue | \`$enqueue\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -input=false -reconfigure -backend-config="${{ env.TF_BACKEND_CONFIG }}"

      - name: Terraform plan
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform plan -input=false \
            -var-file="${{ env.TF_VARS_FILE }}" \
            -var "companion_image=${{ steps.images.outputs.companion }}" \
            -var "kb_image=${{ steps.images.outputs.kb }}" \
            -var "kb_enqueue_image=${{ steps.images.outputs.enqueue }}" \
            -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          {
            echo "### Terraform plan (prod, us-east-1)"
            echo '```'
            grep -E '^\s+# |^Plan:|^No changes' tfplan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event.inputs.plan_only != 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Wait for ECS service stable
        if: github.event.inputs.plan_only != 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # us-east-2 holds only the Aurora read-only secondary. It reads the global
      # cluster ID from us-east-1 state, so it can't plan until us-east-1 has
      # created the cluster (first plan_only run skips it).
      - name: Check Aurora global cluster (us-east-1 state)
        id: global
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          id="$(terraform output -raw aurora_global_cluster_id 2>/dev/null || true)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if [ -z "$id" ]; then
            echo "### us-east-2 skipped: no Aurora global cluster in us-east-1 state yet" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Terraform init (us-east-2)
        if: steps.global.outputs.id != ''
        working-directory: ${{ env.TF_DR_ENV_DIR }}
        run: terraform init -input=false -reconfigure -backend-config="${{ env.TF_DR_BACKEND_CONFIG }}"

      - name: Terraform plan (us-east-2)
        if: steps.global.outputs.id != ''
        working-directory: ${{ env.TF_DR_ENV_DIR }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          {
            echo "### Terraform plan (prod, us-east-2 Aurora secondary)"
            echo '```'
            grep -E '^\s+# |^Plan:|^No changes' tfplan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply (us-east-2)
        if: steps.global.outputs.id != '' && github.event.inputs.plan_only != 'true'
        working-directory: ${{ env.TF_DR_ENV_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
