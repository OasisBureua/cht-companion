name: Monthly Security Scan

on:
  schedule:
    - cron: '0 9 1-7 * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            kb/requirements.txt

      - name: Backend - Install
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: KB - Install
        working-directory: ./kb
        run: pip install -r requirements.txt

      - name: Scan backend (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - name: Scan kb (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./kb
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
