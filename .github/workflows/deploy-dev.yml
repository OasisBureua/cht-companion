name: Deploy to Development

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only: skip ECS/Lambda roll'
        type: boolean
        default: false
      deploy_all:
        description: 'Deploy all lanes (ignore change detection)'
        type: boolean
        default: false
  push:
    branches:
      - 'feature/**'
    paths:
      - 'backend/**'
      - 'kb/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: deploy-cht-companion-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  ECR_BACKEND_REPO: cht-dev-companion
  ECR_WORKER_REPO: cht-dev-companion-kb
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERRAFORM_VERSION: 1.10.5
  TF_ENV_DIR: infrastructure/terraform/environments/us-east-1
  TF_BACKEND_CONFIG: ../backends/us-east-1-development.hcl
  TF_VARS_FILE: ../variables/development.github.tfvars

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

jobs:
  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    outputs:
      deploy_backend: ${{ steps.scope.outputs.deploy_backend }}
      deploy_kb: ${{ steps.scope.outputs.deploy_kb }}
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      base_source: ${{ steps.base.outputs.base_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve change base
        if: github.event.inputs.deploy_all != 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-resolve-deploy-base.sh
          ./scripts/ci-resolve-deploy-base.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before || '' }}" \
            "deploy-dev.yml" \
            "${{ github.ref_name }}" \
            "origin/develop"

      - name: Detect changed paths
        if: github.event.inputs.deploy_all != 'true' && steps.base.outputs.base_resolved == 'true'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.sha }}
          base: ${{ steps.base.outputs.base_sha }}
          list-files: shell
          filters: |
            backend:
              - 'backend/**'
            kb:
              - 'kb/**'
            infra:
              - 'infrastructure/**'

      - name: Set deploy scope
        id: scope
        run: |
          chmod +x scripts/ci-detect-deploy-scope.sh
          FORCE_ALL=false
          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            FORCE_ALL=true
          elif [ "${{ steps.base.outputs.base_resolved || 'false' }}" != "true" ]; then
            echo "No change base SHA; deploying all lanes."
            FORCE_ALL=true
          fi
          ./scripts/ci-detect-deploy-scope.sh \
            "$FORCE_ALL" \
            "${{ steps.filter.outputs.backend || 'false' }}" \
            "${{ steps.filter.outputs.kb || 'false' }}" \
            "${{ steps.filter.outputs.infra || 'false' }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true' || needs.changes.outputs.deploy_infra == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            kb/requirements.txt

      - name: Backend tests
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pytest

      - name: KB tests
        if: needs.changes.outputs.deploy_kb == 'true'
        working-directory: ./kb
        run: |
          pip install -r requirements.txt
          pytest

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform validate
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true' || needs.changes.outputs.deploy_infra == 'true'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy scope summary
        run: |
          echo "## Deploy scope" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lane | Run |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend (ECS cht-companion) | ${{ needs.changes.outputs.deploy_backend }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| KB (Lambda cht-companion-kb) | ${{ needs.changes.outputs.deploy_kb }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra (Terraform plan/apply) | ${{ needs.changes.outputs.deploy_infra }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true'
        id: meta
        run: |
          chmod +x scripts/next-dev-image-tag.sh
          IMAGE_TAG="$(./scripts/next-dev-image-tag.sh ${{ env.ECR_BACKEND_REPO }} "$AWS_REGION")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_kb == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kb image
        if: needs.changes.outputs.deploy_kb == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./kb
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -reconfigure -backend-config="${{ env.TF_BACKEND_CONFIG }}"

      - name: Import existing ECR repos (idempotent)
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        continue-on-error: true
        run: |
          terraform import -var-file="${{ env.TF_VARS_FILE }}" \
            'module.ecr.aws_ecr_repository.companion' cht-dev-companion || true
          terraform import -var-file="${{ env.TF_VARS_FILE }}" \
            'module.ecr.aws_ecr_repository.companion_kb' cht-dev-companion-kb || true

      - name: Terraform plan
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform plan \
            -var-file="${{ env.TF_VARS_FILE }}" \
            -out=tfplan

      - name: Terraform apply
        if: needs.changes.outputs.deploy_infra == 'true' && github.event.inputs.plan_only != 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Update ECS service
        if: needs.changes.outputs.deploy_backend == 'true' && github.event.inputs.plan_only != 'true'
        env:
          CLUSTER: cht-dev-cluster
          SERVICE: cht-dev-companion
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
        run: |
          STATUS="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" --query 'services[0].status' --output text 2>/dev/null || echo MISSING)"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $SERVICE not active yet (status=$STATUS)."
            exit 0
          fi
          TASK_DEF="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$TASK_DEF" --query 'taskDefinition' > task-def.json
          jq --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions = (.containerDefinitions | map(.image = $IMAGE))' \
            task-def.json > new-task-def.json
          NEW_ARN="$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_ARN" --force-new-deployment --region "$AWS_REGION"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION"

      - name: Update Lambda
        if: needs.changes.outputs.deploy_kb == 'true' && github.event.inputs.plan_only != 'true'
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}"
          if ! aws lambda get-function --function-name cht-dev-companion-kb --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Lambda cht-dev-companion-kb not provisioned yet."
            exit 0
          fi
          aws lambda update-function-code --function-name cht-dev-companion-kb --image-uri "$IMAGE" --region "$AWS_REGION"
